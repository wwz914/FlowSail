name: Release

on:
  workflow_dispatch:
    inputs:
      provenance:
        description: '生成 npm provenance（需要 id-token: write 与公开仓库）'
        type: boolean
        default: true
      dry_run:
        description: '只跑发布前检查与打包，不实际发布'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Bundle size gate
        run: pnpm check:size

      - name: Pack install smoke
        run: node scripts/smoke-pack.mjs --react 19

      - name: Configure git identity for release tags
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "xunmu-spuer"
          git config user.email "351488484+xunmu-spuer@users.noreply.github.com"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ inputs.provenance }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release tags
        if: ${{ !inputs.dry_run }}
        run: git push origin --tags
