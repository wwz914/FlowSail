<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowSail · 设计稿 C — 深色智能 / Obsidian</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--app-bg);color:var(--text);font-family:var(--font);font-size:12px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;padding:0;margin:0;cursor:pointer}
  .app{display:flex;flex-direction:column;height:100vh;width:100vw;min-width:1120px;overflow:hidden}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:4px;height:50px;flex:none;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:10}
  .brand{display:flex;align-items:center;gap:9px;margin-right:8px}
  .brand-mark{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--brand-bg);color:var(--brand-ink);box-shadow:var(--brand-shadow,none)}
  .brand-name{font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--text);white-space:nowrap}
  .tb-group{display:flex;align-items:center;gap:1px}
  .tb-sep{width:1px;height:18px;background:var(--border);margin:0 7px;flex:none}
  .tb-spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:var(--btn-r,6px);color:var(--text-2);font-size:12px;font-weight:500;white-space:nowrap;transition:background .15s ease}
  .btn svg{width:14px;height:14px;flex:none;opacity:.8}
  .btn:hover{background:var(--hover)}
  .btn.icon{width:28px;padding:0;justify-content:center}
  .btn-primary{background:var(--primary-bg);color:var(--primary-ink);font-weight:600;padding:0 13px;box-shadow:var(--primary-shadow,none)}
  .btn-primary svg{opacity:1}

  /* hint strip */
  .hint{display:flex;align-items:center;gap:8px;height:30px;flex:none;padding:0 16px;background:var(--hint-bg);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-3);overflow:hidden;white-space:nowrap}
  .hint-badge{flex:none;padding:1px 7px;border-radius:999px;background:var(--badge-bg);color:var(--badge-ink);font-size:9.5px;font-weight:600;letter-spacing:.04em}
  .hint-text{overflow:hidden;text-overflow:ellipsis}

  /* three columns */
  .body{display:flex;flex:1;min-height:0}
  .library{width:180px;flex:none;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--border);overflow:hidden}
  .lib-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 9px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .lib-item{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;border-radius:var(--row-r,6px);color:var(--text-2);font-size:12px;font-weight:500;text-align:left}
  .lib-item:hover{background:var(--hover)}
  .lib-icon{width:22px;height:22px;border-radius:var(--lib-icon-r,6px);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
  .lib-icon svg{width:13px;height:13px}

  .workspace{display:flex;flex-direction:column;flex:1;min-width:0}
  .canvas{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--canvas)}
  .stage{position:relative;width:780px;height:608px;margin:0 auto}

  /* nodes */
  .node{position:absolute;z-index:2;width:160px;height:48px;display:flex;align-items:center;gap:8px;padding:0 9px;background:var(--node-bg);border:1px solid var(--node-border);border-radius:var(--node-r,8px);box-shadow:var(--node-shadow,none);color:var(--text)}
  .node-icon{width:24px;height:24px;border-radius:var(--icon-r,6px);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
  .node-icon svg{width:13px;height:13px;display:block}
  .node-text{display:flex;flex-direction:column;min-width:0;gap:0}
  .node-title{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--node-title);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node-type{font-size:9px;line-height:1.25;color:var(--node-type);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node.is-selected{border-color:var(--sel-border);background:var(--node-sel-bg);box-shadow:var(--sel-shadow)}
  .handle{position:absolute;z-index:3;width:7px;height:7px;border-radius:var(--handle-r,50%);background:var(--handle-bg);border:1.5px solid var(--handle-border)}
  .handle.in{top:-4px;left:50%;margin-left:-3.5px}
  .handle.out{bottom:-4px;left:50%;margin-left:-3.5px}
  .handle.out1{left:30%;margin-left:-3.5px}
  .handle.out2{left:70%;margin-left:-3.5px}
  .node.is-selected .handle{background:var(--handle-sel-bg);border-color:var(--sel-border);box-shadow:var(--handle-sel-shadow,none)}

  /* edges */
  .edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
  .edge{fill:none;stroke:var(--edge);stroke-width:var(--edge-w,1.5px);stroke-linecap:round}
  .edge-label{font-family:var(--font);font-size:9.5px;fill:var(--text-3);stroke:var(--canvas);stroke-width:3;paint-order:stroke;letter-spacing:.02em}
  .edge-tag{fill:var(--panel);stroke:var(--border);stroke-width:1}
  .edge-tag-text{font-family:var(--mono);font-size:8.5px;fill:var(--text-2)}

  /* selected node floating toolbar */
  .selbar{position:absolute;left:300px;top:240px;z-index:4;display:flex;align-items:center;height:28px;padding:0 4px;background:var(--selbar-bg);border:1px solid var(--selbar-border);border-radius:var(--selbar-r,7px);box-shadow:var(--selbar-shadow,none);white-space:nowrap}
  .selbar .count{padding:0 7px;font-size:10.5px;color:var(--text-3)}
  .selbar .sep{width:1px;height:12px;background:var(--border);margin:0 2px;flex:none}
  .selbar button{height:22px;padding:0 6px;border-radius:4px;font-size:10.5px;color:var(--text-2)}
  .selbar button:hover{background:var(--hover)}
  .selbar .danger{color:var(--danger)}

  /* zoom */
  .zoom{position:absolute;left:18px;bottom:16px;z-index:3;display:flex;align-items:center;height:30px;padding:0 5px;background:var(--zoom-bg);border:1px solid var(--zoom-border);border-radius:var(--zoom-r,8px);box-shadow:var(--zoom-shadow,none);color:var(--text-2)}
  .zoom button{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--text-2)}
  .zoom .pct{min-width:40px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-2)}
  .zoom .vsep{width:1px;height:14px;background:var(--border);margin:0 3px}
  .zoom .fit{padding:0 7px;width:auto;font-size:10.5px;border-radius:4px}

  /* bottom dock */
  .dock{flex:none;height:112px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--border)}
  .dock-row{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:0;padding:0 16px}
  .dock-row + .dock-row{border-top:1px solid var(--border-soft)}
  .dock-line{display:flex;align-items:center;gap:6px}
  .dock-chev{width:10px;flex:none;font-size:9px;color:var(--text-3)}
  .dock-title{font-size:11.5px;font-weight:600;color:var(--text)}
  .dock-status{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:10px;color:var(--text-3);white-space:nowrap}
  .dock-status.ok{color:var(--ok);background:var(--ok-bg);padding:1px 7px;border-radius:999px;font-weight:500}
  .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
  .dock-sub{padding-left:16px;font-size:10.5px;color:var(--text-3)}

  /* inspector */
  .inspector{width:320px;flex:none;display:flex;flex-direction:column;padding:16px 18px;background:var(--panel);border-left:1px solid var(--border);overflow:hidden}
  .insp-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .insp-icon{width:28px;height:28px;border-radius:var(--icon-r,7px);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
  .insp-icon svg{width:14px;height:14px}
  .insp-title{display:flex;flex-direction:column;gap:1px;min-width:0}
  .insp-title h2{margin:0;font-size:12.5px;font-weight:650;color:var(--text);letter-spacing:.01em}
  .insp-code{font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--text-3)}
  .field{margin-bottom:12px}
  .field label,.flabel{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:10.5px;font-weight:500;color:var(--text-2)}
  .req{font-size:8.5px;font-weight:600;padding:1px 5px;border-radius:999px;color:var(--danger);background:var(--danger-bg);letter-spacing:.02em}
  .input,textarea{display:block;width:100%;border:1px solid var(--input-border);background:var(--input-bg);border-radius:var(--input-r,6px);font-family:var(--font);font-size:11.5px;line-height:1.5;color:var(--text);padding:7px 9px;outline:none}
  .input{height:32px;padding:0 9px}
  textarea{height:56px;resize:none}
  textarea.code{font-family:var(--mono);font-size:10.5px}
  .help{margin-top:5px;font-size:9.5px;color:var(--text-3)}
  .var-btn{display:inline-flex;align-items:center;gap:5px;height:24px;margin-top:8px;padding:0 8px;border:1px dashed var(--input-border);border-radius:5px;font-size:10px;color:var(--text-2)}
  .var-btn svg{width:12px;height:12px;opacity:.8}
  .section{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .section-title{display:flex;align-items:center;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
  .section-title .test-btn{margin-left:auto;height:22px;padding:0 9px;border:1px solid var(--input-border);border-radius:5px;background:var(--input-bg);font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text-2)}
  .io-row{display:flex;gap:9px;margin-bottom:8px}
  .io-row:last-child{margin-bottom:0}
  .io-key{width:26px;flex:none;padding-top:1px;font-size:10px;color:var(--text-3)}
  .io-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .io-line{display:flex;align-items:baseline;gap:6px}
  .io-line code{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;background:var(--code-bg);color:var(--text)}
  .io-type{font-family:var(--mono);font-size:9px;color:var(--text-3)}
  .io-desc{font-size:9.5px;color:var(--text-3)}

  :root{
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --app-bg:#07090d;--panel:#0d1119;--canvas:#0a0d14;
    --border:#1d2532;--border-soft:#161d28;
    --text:#e9edf5;--text-2:#a7b1c2;--text-3:#7c899d;
    --accent:#8b7cff;--accent-soft:rgba(139,124,255,.16);--hover:#151c28;
    --primary-bg:linear-gradient(135deg,#7c6cff 0%,#4f46e5 100%);--primary-ink:#ffffff;
    --primary-shadow:0 6px 18px rgba(99,88,255,.32);
    --grid:#1b2433;--edge:#41506d;--edge-w:1.5px;
    --node-bg:#111722;--node-border:#2a3648;--node-r:10px;--icon-r:7px;
    --node-shadow:0 8px 24px rgba(0,0,0,.35);
    --node-title:#eef2f9;--node-type:#8b97ab;
    --node-sel-bg:#141b29;--sel-border:#8b7cff;
    --sel-shadow:0 0 0 3px rgba(139,124,255,.20),0 0 34px rgba(124,108,255,.34);
    --handle-bg:#0b0f17;--handle-border:#465369;--handle-sel-bg:#0b0f17;--handle-sel-shadow:0 0 8px rgba(139,124,255,.6);
    --btn-r:7px;--row-r:8px;--lib-icon-r:7px;
    --brand-bg:linear-gradient(135deg,#7c6cff,#2dd4bf);--brand-ink:#080a0f;
    --badge-bg:#151c29;--badge-ink:#a5a0ff;--hint-bg:#0b0f17;
    --input-bg:#0a0e15;--input-border:#222c3c;--input-r:8px;--code-bg:#0f1622;
    --selbar-bg:rgba(17,23,34,.94);--selbar-border:#283346;--selbar-shadow:0 14px 40px rgba(0,0,0,.5);
    --selbar-r:9px;
    --zoom-bg:rgba(15,20,30,.92);--zoom-border:#253041;--zoom-r:8px;--zoom-shadow:0 8px 24px rgba(0,0,0,.35);
    --ok:#34d399;--ok-bg:rgba(52,211,153,.10);--danger:#ff7b7b;--danger-bg:rgba(255,123,123,.10);
  }
  .t-start{--c:#4ade80}.t-end{--c:#fb923c}.t-llm{--c:#a78bfa}.t-plugin{--c:#22d3ee}.t-condition{--c:#fb7185}.t-code{--c:#818cf8}.t-notify{--c:#60a5fa}
  .topbar{background:rgba(11,15,22,.9);backdrop-filter:blur(14px)}
  .canvas{background-image:radial-gradient(circle at 1px 1px,rgba(56,78,110,.5) 1px,transparent 1.4px),radial-gradient(700px 420px at 50% -2%,rgba(124,108,255,.22),transparent 66%),radial-gradient(620px 380px at 78% 10%,rgba(124,108,255,.12),transparent 70%),radial-gradient(540px 360px at 12% 94%,rgba(45,212,191,.10),transparent 70%);background-size:22px 22px,100% 100%,100% 100%,100% 100%}
  .node{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--node-shadow)}
  .brand-mark{box-shadow:0 0 20px rgba(124,108,255,.35)}
  .node-icon{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 0 14px color-mix(in srgb,var(--c) 18%,transparent)}
  .node.is-selected{border-color:rgba(139,124,255,.92)}
  .selbar{backdrop-filter:blur(10px)}
  .dock-status.ok{border:1px solid rgba(52,211,153,.22)}
  .hint-badge{border:1px solid rgba(139,124,255,.28)}
  .brand-name{background:linear-gradient(90deg,#eef0ff,#a5f3e8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .req{color:#ffb4b4;background:rgba(255,123,123,.12)}
  .btn-primary svg{opacity:1}
  .selbar .count{color:#6e7a8e}
  .selbar .danger{color:#ff8f8f}
  .inspector{box-shadow:inset 1px 0 0 rgba(255,255,255,.02)}
  .input,.input textarea{caret-color:#8b7cff}
</style>
</head>
<body>
<div class="app" data-direction="c">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.6 4.6h5.6c1.7 0 2.7.8 2.7 2.1s-1 2.1-2.7 2.1H5.1c-1.3 0-2 .5-2 1.4s.7 1.4 2 1.4h6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-name">FlowSail</span></div>
    <div class="tb-group">
      <button class="btn icon" title="撤销"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 7.2h6c2.1 0 3.8 1.5 3.8 3.4S11.3 14 9.2 14H6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.8 4.6 3 7.2l2.8 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn icon" title="重做"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12.8 7.2h-6c-2.1 0-3.8 1.5-3.8 3.4S4.7 14 6.8 14h2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10.2 4.6 13 7.2l-2.8 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.6 6V3.2a.6.6 0 0 1 .6-.6H6M10 2.6h2.8a.6.6 0 0 1 .6.6V6M13.4 10v2.8a.6.6 0 0 1-.6.6H10M6 13.4H3.2a.6.6 0 0 1-.6-.6V10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>适应画布</button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group"><button class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.2 2.8c-1.6 0-1.9.7-1.9 2.2v.9c0 .9-.4 1.4-1.2 1.4.8 0 1.2.5 1.2 1.4v.9c0 1.5.3 2.2 1.9 2.2M9.8 2.8c1.6 0 1.9.7 1.9 2.2v.9c0 .9.4 1.4 1.2 1.4-.8 0-1.2.5-1.2 1.4v.9c0 1.5-.3 2.2-1.9 2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>会话变量</button></div>
    <span class="tb-sep"></span>
    <div class="tb-group">
      <button class="btn btn-primary"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.6 2.9v10.2L13 8 4.6 2.9Z" fill="currentColor"/></svg>试运行</button>
      <button class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10.6V2.6m0 0L5 5.6m3-3 3 3M3 10.4v2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>导出</button>
      <button class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.6v8m0 0 3-3m-3 3-3-3M3 10.4v2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>导入</button>
    </div>
    <span class="tb-spacer"></span>
    <button class="btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>亮色主题</button>
  </header>

  <div class="hint"><span class="hint-badge">提示</span><span class="hint-text">拖拽框选 · Ctrl/Cmd+A 全选 · 双击节点重命名 · 从输入锚点反向拖拽改接 · Tab 进入画布后方向键移动</span></div>

  <div class="body">
    <aside class="library">
      <div class="lib-head"><span>节点</span></div>
      <button class="lib-item t-start"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.2 3.3v9.4L12.6 8 5.2 3.3Z" fill="currentColor"/></svg></span>开始</button>
        <button class="lib-item t-end"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2" fill="currentColor"/></svg></span>结束</button>
        <button class="lib-item t-llm"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.8 1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5L8 1.8Z" fill="currentColor"/></svg></span>大模型</button>
        <button class="lib-item t-plugin"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 1.8v3.4H2.6a.8.8 0 0 0-.8.8V10a.8.8 0 0 0 .8.8h3.4V14.2h.8a.8.8 0 0 0 .8-.8v-3.4h3.4a.8.8 0 0 0 .8-.8V6a.8.8 0 0 0-.8-.8h-3.4V1.8a.8.8 0 0 0-.8-.8H6.8a.8.8 0 0 0-.8.8Z" fill="currentColor"/></svg></span>插件</button>
        <button class="lib-item t-condition"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 2.6h9.6a.8.8 0 0 1 .61 1.31L8.9 8l4.51 4.09a.8.8 0 0 1-.61 1.31H3.2a.8.8 0 0 1-.61-1.31L7.1 8 2.59 3.91A.8.8 0 0 1 3.2 2.6Z" fill="currentColor"/></svg></span>条件</button>
        <button class="lib-item t-code"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.6 4.4 2.2 8l3.4 3.6 1-1L4.1 8l2.5-2.6-1-1Zm4.8 0-1 1L11.9 8l-2.5 2.6 1 1L13.8 8l-3.4-3.6Z" fill="currentColor"/></svg></span>代码</button>
        <button class="lib-item t-notify"><span class="lib-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8a4.2 4.2 0 0 0-4.2 4.2v2.4L2.6 11a.6.6 0 0 0 .5.9h9.8a.6.6 0 0 0 .5-.9L12.2 8.4V6A4.2 4.2 0 0 0 8 1.8Zm-1.6 11.4a1.6 1.6 0 0 0 3.2 0H6.4Z" fill="currentColor"/></svg></span>通知</button>
    </aside>

    <main class="workspace">
      <div class="canvas">
        <div class="stage">
          <svg class="edges" width="780" height="608" viewBox="0 0 780 608">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M1.4 1.4 8 5 1.4 8.6" fill="none" stroke="var(--edge)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <path class="edge" d="M390 111 V166" marker-end="url(#arrow)"/>
        <path class="edge" d="M390 221 V276" marker-end="url(#arrow)"/>
        <path class="edge" d="M358 331 C358 366 290 362 290 396" marker-end="url(#arrow)"/>
        <path class="edge" d="M422 331 C422 366 510 362 510 396" marker-end="url(#arrow)"/>
        <text class="edge-label" x="321" y="369" text-anchor="middle">是</text>
        <text class="edge-label" x="467" y="369" text-anchor="middle">否</text>
          </svg>
          <div class="node t-start" style="left:310px;top:60px">
        <span class="node-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.2 3.3v9.4L12.6 8 5.2 3.3Z" fill="currentColor"/></svg></span>
        <span class="node-text"><span class="node-title">Start</span><span class="node-type">开始</span></span>
        <span class="handle out"></span>
      </div>
          <div class="node t-llm" style="left:310px;top:170px">
        <span class="node-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.8 1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5L8 1.8Z" fill="currentColor"/></svg></span>
        <span class="node-text"><span class="node-title">LLM</span><span class="node-type">大模型</span></span>
        <span class="handle in"></span><span class="handle out"></span>
      </div>
          <div class="node t-condition is-selected" style="left:310px;top:280px">
        <span class="node-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 2.6h9.6a.8.8 0 0 1 .61 1.31L8.9 8l4.51 4.09a.8.8 0 0 1-.61 1.31H3.2a.8.8 0 0 1-.61-1.31L7.1 8 2.59 3.91A.8.8 0 0 1 3.2 2.6Z" fill="currentColor"/></svg></span>
        <span class="node-text"><span class="node-title">Condition</span><span class="node-type">条件</span></span>
        <span class="handle in"></span><span class="handle out out1"></span><span class="handle out out2"></span>
      </div>
          <div class="node t-llm" style="left:210px;top:400px">
        <span class="node-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1.8 1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5L8 1.8Z" fill="currentColor"/></svg></span>
        <span class="node-text"><span class="node-title">LLM (是)</span><span class="node-type">大模型</span></span>
        <span class="handle in"></span><span class="handle out"></span>
      </div>
          <div class="node t-end" style="left:430px;top:400px">
        <span class="node-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2" fill="currentColor"/></svg></span>
        <span class="node-text"><span class="node-title">End</span><span class="node-type">结束</span></span>
        <span class="handle in"></span>
      </div>
          <div class="selbar">
            <span class="count">1 个节点</span><span class="sep"></span>
            <button>创建副本</button><button>复制</button><span class="sep"></span><button class="danger">删除</button>
          </div>
        </div>
        <div class="zoom">
          <button title="缩小"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.4 8h9.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button><span class="pct">100%</span><button title="放大"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <span class="vsep"></span><button class="fit">适应</button>
        </div>
      </div>

      <section class="dock">
        <div class="dock-row">
          <div class="dock-line"><span class="dock-chev">▾</span><span class="dock-title">校验</span><span class="dock-status ok"><span class="dot"></span>没有发现问题</span></div>
          <div class="dock-sub">文档看起来没问题。</div>
        </div>
        <div class="dock-row">
          <div class="dock-line"><span class="dock-chev">▾</span><span class="dock-title">运行记录</span><span class="dock-status">尚未运行</span></div>
          <div class="dock-sub">点击工具栏的「试运行」开始。</div>
        </div>
      </section>
    </main>

    <aside class="inspector">
      <div class="insp-head">
        <span class="insp-icon t-condition"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.2 2.6h9.6a.8.8 0 0 1 .61 1.31L8.9 8l4.51 4.09a.8.8 0 0 1-.61 1.31H3.2a.8.8 0 0 1-.61-1.31L7.1 8 2.59 3.91A.8.8 0 0 1 3.2 2.6Z" fill="currentColor"/></svg></span>
        <div class="insp-title"><h2>条件</h2><span class="insp-code">condition</span></div>
      </div>

      <div class="field">
        <label>名称</label>
        <input class="input" value="Condition" readonly>
      </div>

      <div class="field">
        <label>描述</label>
        <textarea placeholder="这个节点做什么"></textarea>
      </div>

      <div class="field">
        <label>判断条件 <span class="req">必填</span></label>
        <textarea class="code" spellcheck="false">text.length &gt; 40</textarea>
        <div class="help">求值为布尔的表达式</div>
        <button class="var-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.2 2.8c-1.6 0-1.9.7-1.9 2.2v.9c0 .9-.4 1.4-1.2 1.4.8 0 1.2.5 1.2 1.4v.9c0 1.5.3 2.2 1.9 2.2M9.8 2.8c1.6 0 1.9.7 1.9 2.2v.9c0 .9.4 1.4 1.2 1.4-.8 0-1.2.5-1.2 1.4v.9c0 1.5-.3 2.2-1.9 2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>插入变量</button>
      </div>

      <div class="section">
        <div class="section-title">输入 / 输出</div>
        <div class="io-row">
          <span class="io-key">输入</span>
          <span class="io-body"><span class="io-line"><code>value</code><span class="io-type">any</span></span><span class="io-desc">参与判断的值</span></span>
        </div>
        <div class="io-row">
          <span class="io-key">输出</span>
          <span class="io-body"><span class="io-line"><code>result</code><span class="io-type">boolean</span></span><span class="io-desc">条件分支的判断结果</span></span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">单节点测试<button class="test-btn">测试</button></div>
        <input class="input" placeholder="参与判断的值">
      </div>
    </aside>
  </div>
</div>
</body>
</html>
